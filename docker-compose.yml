version: '3.8'

services:
  ext-to-rss:
    # Build locally or pull pre-built image from GHCR
    build: .
    # image: ghcr.io/YOUR_GITHUB_USERNAME/ext.to-rss:latest
    container_name: ext-to-rss
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - EXT_DOMAIN=https://extto.com
      - DB_PATH=/app/data/cache.db
      - CACHE_TTL_MINUTES=60
      - HEADLESS=true
      - MAX_MAGNETS_PER_QUERY=25
    volumes:
      - ./data:/app/data

